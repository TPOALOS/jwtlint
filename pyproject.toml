[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jwtlint"
version = "1.1.0"
description = "Offline JWT inspector that flags alg none, missing expiry, broken time claims and sensitive claims, without verifying signatures. JSON output."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "TPOALOS"}]
keywords = ["jwt", "authentication", "appsec", "linter"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/TPOALOS/jwtlint"

[project.scripts]
jwtlint = "jwtlint:main"

[tool.setuptools]
py-modules = ["jwtlint"]
